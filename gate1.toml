# Gate 1 (week 2): 1,000 public standards pages from one Common Crawl crawl.
#   uv run strata gate1 run gate1.toml        then        uv run strata gate1 check JOB_ID
#
# Counted in CC-MAIN-2026-43 on 2026-11-08 with `strata count`: 192 PEP pages match, so 175 leaves
# spares for pages robots.txt rules out; RFC info pages make up the rest.
crawl = "CC-MAIN-2026-43"
# A cap, not a target: 1,000 pages, a few dozen of DuckDB's URL-index requests, two robots.txt
# records, and room for retries. A local rehearsal of the same run spent 1,017.
budget = 1200
index = "columnar"

[[target]]
site = "peps.python.org"
pattern = '^https://peps\.python\.org/pep-\d{4}/$'
pages = 175

[[target]]
site = "www.rfc-editor.org"
pattern = '^https://www\.rfc-editor\.org/info/rfc\d+/$'
pages = 825

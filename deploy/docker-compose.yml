# Local services for Strata. Week 1 needs only Postgres; MinIO joins in week 2.
#   docker compose -f deploy/docker-compose.yml up -d --wait
name: strata

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata # local development only
      POSTGRES_DB: strata_ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the ducklake_catalog database on first start (DuckLake needs it to exist).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata_ops"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:

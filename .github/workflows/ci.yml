name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not postgres"

  integration:
    name: integration (Postgres, DuckLake)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: strata_ops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U strata -d strata_ops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      STRATA_TEST_PG_DSN: postgresql://strata:strata@localhost:5432/strata_ops
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # DuckDB downloads the ducklake and postgres extensions here, so the DuckLake test runs too.
      - run: uv run pytest -m postgres -ra

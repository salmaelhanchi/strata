[project]
name = "strata-core"
version = "0.1.0"
description = "Strata core: models, provenance ids, settings, ops database, budget ledger, lake tables"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "duckdb>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_core"]

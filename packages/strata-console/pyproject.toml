[project]
name = "strata-console"
version = "0.1.0"
description = "Strata console: a REST API and a web app over the services"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "strata-core",
    "strata-fetch",
    "strata-services",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
]

[tool.uv.sources]
strata-core = { workspace = true }
strata-fetch = { workspace = true }
strata-services = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_console"]
# The built web app is git-ignored (make web builds it) but belongs in the wheel.
artifacts = ["src/strata_console/static/**"]

[project]
name = "strata-fetch"
version = "0.1.0"
description = "Strata fetch: Common Crawl discovery, polite byte-range fetcher, WARC verification, raw storage"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "strata-core",
    "httpx>=0.28",
    "warcio>=1.7",
]

[tool.uv.sources]
strata-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_fetch"]

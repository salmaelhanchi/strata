[project]
name = "strata-services"
version = "0.1.0"
description = "Strata services: the use cases (profile, diff, changes, pull) every interface calls"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "strata-core",
    "strata-fetch",
    "trafilatura>=2.0",
]

[tool.uv.sources]
strata-core = { workspace = true }
strata-fetch = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_services"]

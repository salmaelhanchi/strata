[project]
name = "strata-cli"
version = "0.1.0"
description = "Strata CLI: a thin Typer layer over the library functions"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "strata-core",
    "strata-fetch",
    "typer>=0.15",
]

[project.scripts]
strata = "strata_cli.main:app"

[tool.uv.sources]
strata-core = { workspace = true }
strata-fetch = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_cli"]
